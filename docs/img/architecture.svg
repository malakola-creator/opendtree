<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="dtree architecture: people, the CLI and AI agents reach one server; the page, the API, the CLI and MCP share one project and one SQLite store; feature modules add jobs, verification, merging, spend, settings, projects, story and languages; outside dtree are the git repository, the sandbox, the model APIs and the files under ~/.config/dtree">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66fcf1"/></marker>
    <style>
      text { font-family: "Segoe UI", "Noto Sans", "Noto Sans Thai", Helvetica, Arial, sans-serif; fill: #e6e8ea; font-size: 13px; }
      .t { font-size: 15px; font-weight: 600; }
      .h { font-size: 12px; fill: #9aa3ad; letter-spacing: .08em; }
      .s { font-size: 11.5px; fill: #9aa3ad; }
      .c { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #9aa3ad; }
      .box { fill: #1f2833; stroke: #3b4654; stroke-width: 1.5; rx: 8; }
      .core { fill: #16202b; stroke: #66fcf1; stroke-width: 1.5; rx: 8; }
      .mod { fill: #121821; stroke: #3b4654; stroke-width: 1.2; rx: 7; }
      .out { fill: #0f141b; stroke: #6b7686; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 8; }
      .ln { stroke: #9aa3ad; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .lc { stroke: #66fcf1; stroke-width: 1.6; fill: none; marker-end: url(#ac); }
      .band { fill: none; stroke: #222a35; stroke-width: 1; stroke-dasharray: 2 4; rx: 10; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#0b0c10"/>
  <text x="24" y="34" class="t" font-size="18">dtree — architecture</text>
  <text x="24" y="54" class="s">one process, the Python standard library; one project at a time, switched in place; every write a JSON POST</text>

  <!-- tier A: who -->
  <text x="24" y="90" class="h">WHO</text>
  <rect x="90" y="72" width="250" height="56" class="box"/>
  <text x="215" y="95" text-anchor="middle" class="t">Person · browser</text>
  <text x="215" y="114" text-anchor="middle" class="s">the tree page, the board, the reader</text>
  <rect x="475" y="72" width="250" height="56" class="box"/>
  <text x="600" y="95" text-anchor="middle" class="t">Person · terminal</text>
  <text x="600" y="114" text-anchor="middle" class="c">dtree add · answer · ai · merge …</text>
  <rect x="860" y="72" width="300" height="56" class="box"/>
  <text x="1010" y="95" text-anchor="middle" class="t">AI agents · MCP over stdio</text>
  <text x="1010" y="114" text-anchor="middle" class="c">dtree_ask · dtree_context · dtree_done …</text>

  <!-- arrows A -> B -->
  <path d="M215,128 L215,172" class="ln"/>
  <text x="222" y="156" class="s">HTTP · JSON</text>
  <path d="M600,128 L600,172" class="ln"/>
  <text x="607" y="156" class="s">same code, no server needed</text>
  <path d="M1010,128 L1010,172" class="ln"/>
  <text x="1017" y="156" class="s">stdio</text>

  <!-- tier B: the server -->
  <text x="24" y="190" class="h">DTREE</text>
  <rect x="78" y="172" width="1100" height="196" class="band"/>
  <rect x="90" y="186" width="250" height="52" class="box"/>
  <text x="215" y="208" text-anchor="middle" class="t">tree page</text>
  <text x="215" y="226" text-anchor="middle" class="c">static/tree.html · static/lang/*.json</text>
  <rect x="360" y="186" width="230" height="52" class="box"/>
  <text x="475" y="208" text-anchor="middle" class="t">JSON API</text>
  <text x="475" y="226" text-anchor="middle" class="c">server.py · /api/… · /lang/…</text>
  <rect x="610" y="186" width="200" height="52" class="box"/>
  <text x="710" y="208" text-anchor="middle" class="t">CLI</text>
  <text x="710" y="226" text-anchor="middle" class="c">cli.py</text>
  <rect x="830" y="186" width="340" height="52" class="box"/>
  <text x="1000" y="208" text-anchor="middle" class="t">MCP server</text>
  <text x="1000" y="226" text-anchor="middle" class="c">mcp.py · the store as tools</text>
  <path d="M340,212 L360,212" class="ln"/>

  <!-- core -->
  <path d="M475,238 L475,276" class="lc"/>
  <path d="M710,238 L710,276" class="lc"/>
  <path d="M1000,238 L1000,276" class="lc"/>
  <rect x="200" y="276" width="420" height="78" class="core"/>
  <text x="410" y="300" text-anchor="middle" class="t" fill="#66fcf1">Project</text>
  <text x="410" y="320" text-anchor="middle" class="c">project.py · .dtree/config.json · mode: decisions | story</text>
  <text x="410" y="340" text-anchor="middle" class="s">agents, budgets, sandbox, verify, server — checked by settings.py</text>
  <rect x="650" y="276" width="500" height="78" class="core"/>
  <text x="900" y="300" text-anchor="middle" class="t" fill="#66fcf1">Store · one SQLite file</text>
  <text x="900" y="320" text-anchor="middle" class="c">store.py · .dtree/decisions.sqlite</text>
  <text x="900" y="340" text-anchor="middle" class="s">decisions · events · trials · jobs · checks · requests — words per language (texts)</text>
  <path d="M620,315 L650,315" class="ln"/>

  <!-- tier C: feature modules -->
  <text x="24" y="406" class="h">MODULES</text>
  <text x="1170" y="406" text-anchor="end" class="s">each adds its routes to the API and its commands to the CLI</text>
  <path d="M410,354 L410,420" class="ln"/>
  <path d="M900,354 L900,420" class="ln"/>
  <g>
    <rect x="90" y="420" width="128" height="66" class="mod"/><text x="154" y="443" text-anchor="middle" class="t">jobs</text><text x="154" y="461" text-anchor="middle" class="s">agents, runner,</text><text x="154" y="476" text-anchor="middle" class="s">races, compare</text>
    <rect x="226" y="420" width="128" height="66" class="mod"/><text x="290" y="443" text-anchor="middle" class="t">verify</text><text x="290" y="461" text-anchor="middle" class="s">tests on tip and</text><text x="290" y="476" text-anchor="middle" class="s">base, in a sandbox</text>
    <rect x="362" y="420" width="128" height="66" class="mod"/><text x="426" y="443" text-anchor="middle" class="t">merge</text><text x="426" y="461" text-anchor="middle" class="s">merge-check, --no-ff,</text><text x="426" y="476" text-anchor="middle" class="s">update with the base</text>
    <rect x="498" y="420" width="128" height="66" class="mod"/><text x="562" y="443" text-anchor="middle" class="t">spend</text><text x="562" y="461" text-anchor="middle" class="s">budgets, caps,</text><text x="562" y="476" text-anchor="middle" class="s">tokens per question</text>
    <rect x="634" y="420" width="128" height="66" class="mod"/><text x="698" y="443" text-anchor="middle" class="t">settings</text><text x="698" y="461" text-anchor="middle" class="s">the config checked,</text><text x="698" y="476" text-anchor="middle" class="s">keys write-only</text>
    <rect x="770" y="420" width="128" height="66" class="mod"/><text x="834" y="443" text-anchor="middle" class="t">projects</text><text x="834" y="461" text-anchor="middle" class="s">registry, switch,</text><text x="834" y="476" text-anchor="middle" class="s">export · import · save as</text>
    <rect x="906" y="420" width="128" height="66" class="mod"/><text x="970" y="443" text-anchor="middle" class="t">story</text><text x="970" y="461" text-anchor="middle" class="s">scenes, the reader,</text><text x="970" y="476" text-anchor="middle" class="s">the book (.md)</text>
    <rect x="1042" y="420" width="128" height="66" class="mod"/><text x="1106" y="443" text-anchor="middle" class="t">languages</text><text x="1106" y="461" text-anchor="middle" class="s">translation files,</text><text x="1106" y="476" text-anchor="middle" class="s">template, check</text>
  </g>

  <!-- tier D: outside -->
  <text x="24" y="560" class="h">OUTSIDE</text>
  <rect x="90" y="574" width="300" height="110" class="out"/>
  <text x="240" y="598" text-anchor="middle" class="t">Git repository</text>
  <text x="240" y="618" text-anchor="middle" class="c">main · dec/ID-OPTION · alt/ID-OPTION</text>
  <text x="240" y="636" text-anchor="middle" class="s">worktrees in a shadow repository per trial;</text>
  <text x="240" y="652" text-anchor="middle" class="s">the project's .git read-only to an agent;</text>
  <text x="240" y="668" text-anchor="middle" class="s">nothing ever pushed</text>
  <rect x="420" y="574" width="300" height="110" class="out"/>
  <text x="570" y="598" text-anchor="middle" class="t">Sandbox</text>
  <text x="570" y="618" text-anchor="middle" class="c">bubblewrap · egress proxy</text>
  <text x="570" y="636" text-anchor="middle" class="s">an agent writes only its worktree;</text>
  <text x="570" y="652" text-anchor="middle" class="s">no network but the allowed hosts;</text>
  <text x="570" y="668" text-anchor="middle" class="s">a cap per job, per agent, per month</text>
  <rect x="750" y="574" width="300" height="110" class="out"/>
  <text x="900" y="598" text-anchor="middle" class="t">Model APIs</text>
  <text x="900" y="618" text-anchor="middle" class="c">claude · codex · OpenAI-compatible</text>
  <text x="900" y="636" text-anchor="middle" class="s">Claude Code CLI, Codex CLI, or the chat loop:</text>
  <text x="900" y="652" text-anchor="middle" class="s">Muse, Grok, Gemini, Ollama, llama.cpp —</text>
  <text x="900" y="668" text-anchor="middle" class="s">a key read at call time, never stored or shown</text>
  <rect x="1070" y="574" width="110" height="110" class="out"/>
  <text x="1125" y="598" text-anchor="middle" class="t">Files</text>
  <text x="1125" y="618" text-anchor="middle" class="c">~/.config/dtree</text>
  <text x="1125" y="636" text-anchor="middle" class="s">keys/ (0600)</text>
  <text x="1125" y="652" text-anchor="middle" class="s">projects.json</text>
  <text x="1125" y="668" text-anchor="middle" class="s">lang/*.json</text>

  <!-- arrows C -> D -->
  <path d="M154,486 L190,574" class="ln"/>
  <path d="M426,486 L300,574" class="ln"/>
  <path d="M290,486 L500,574" class="ln"/>
  <path d="M154,486 L520,574" class="ln"/>
  <path d="M570,574 L860,574" class="ln" style="marker-end:url(#a)" transform="translate(0,-6)"/>
  <path d="M698,486 L1100,574" class="ln"/>
  <path d="M834,486 L1110,574" class="ln"/>
  <path d="M1106,486 L1125,574" class="ln"/>
  <text x="640" y="562" class="s">the runner's chat loop calls the API from outside the sandbox</text>
  <text x="24" y="735" class="s">legend: solid = calls · dashed box = outside dtree · cyan = the one project and store every entry shares</text>
</svg>
