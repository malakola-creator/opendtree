<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dtree — decision tree / ต้นไม้การตัดสินใจ</title>
<!-- dtree's page: a project's questions as a decision tree. Each question branches into its options, the answer marks the branch taken,
     and a later question that names an earlier one ("#41") grows from that question's chosen branch; the other questions it names are
     cross links. Questions are asked, answered, dismissed, reopened and commented here; another option of a decided question can be
     tried on its own git branch, and a trial can be sent to an AI agent (Claude Code, Codex, or a chat model: Muse, Grok, a local one)
     that builds it in a worktree and ends at the measurement for the person to choose. -->
<style>
:root { --bg: #0b0c10; --panel: #1f2833; --text: #e6e8ea; --dim: #9aa3ad; --accent: #66fcf1; --line: #3b4654;
  --open: #f59e0b; --decided: #60a5fa; --done: #22c55e; --dismissed: #6b7280; --chosen: #22c55e; --rec: #facc15;
  --font: "Segoe UI", "Leelawadee UI", Tahoma, "Noto Sans Thai", "Loma", "Garuda", sans-serif; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
body { display: flex; flex-direction: column; overflow: hidden; }
html[data-lang="th"] .en, html:not([data-lang="th"]) .th { display: none !important; }   /* any language but Thai shows the English spans (translated by setLang when its file has them) */
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
button, select, input, textarea { background: #2b3542; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; }
button, select { cursor: pointer; }
button[aria-pressed="true"] { background: rgba(102, 252, 241, .25); }
input[type="search"] { width: 180px; }
[hidden] { display: none !important; }
label.chk { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
#proj { color: var(--accent); }
#wrap { display: flex; flex: 1 1 0; min-height: 0; }
#view { flex: 1 1 0; min-width: 0; position: relative; overflow: hidden; cursor: grab; }
#view.drag { cursor: grabbing; }
svg { display: block; width: 100%; height: 100%; user-select: none; }
aside { flex: 0 0 380px; width: 380px; overflow: auto; padding: 10px 12px; background: #141922; border-left: 1px solid #2b3542; font-size: 13px; }
aside h2 { font-size: 14px; margin: 10px 0 4px; color: var(--accent); }
aside h3 { font-size: 13px; margin: 8px 0 2px; }
.dim { color: var(--dim); }
.legend span { display: inline-block; margin: 2px 10px 2px 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.opt { padding: 4px 6px; margin: 3px 0; border-radius: 6px; border: 1px solid #2b3542; }
.opt.chosen { border-color: var(--chosen); background: rgba(34, 197, 94, .12); }
.opt.was { border-style: dashed; border-color: #4b6b57; }
.trial { margin: 4px 0 2px 10px; padding: 3px 6px; border-left: 3px solid var(--line); }
.ailog { max-height: 260px; overflow: auto; font-size: 11px; background: #0d1117; border: 1px solid #222a35; padding: 4px 6px; margin-top: 4px; white-space: pre-wrap; }
.opt button, .trial button, .qacts button { font-size: 12px; padding: 2px 8px; margin: 4px 4px 0 0; }
.race { border: 1px dashed var(--line); border-radius: 6px; padding: 4px 6px; margin: 4px 0; }
.race label { display: block; margin: 1px 0; }
.race label.off { color: var(--dim); }
.race input[type=text] { width: 100%; box-sizing: border-box; margin: 3px 0; }
.race button { font-size: 12px; padding: 2px 8px; margin: 4px 4px 0 0; }
.cmpwrap { overflow-x: auto; color-scheme: dark; }
aside { color-scheme: dark; }
aside.wide { flex-basis: 820px; width: 820px; }
#cmpWide { font-size: 11px; padding: 1px 6px; margin-left: 6px; }
table.cmp { border-collapse: collapse; font-size: 11px; min-width: 100%; }
.cmp th, .cmp td { border-bottom: 1px solid #222a35; padding: 3px 4px; vertical-align: top; text-align: left; overflow-wrap: normal; }
.cmp th { color: var(--dim); font-weight: normal; white-space: nowrap; }
.cmp td.n { white-space: nowrap; text-align: right; }
.cmp td.best { background: rgba(34, 197, 94, .14); }
.cmp tr.adopted td { color: var(--chosen); }
.cmp details summary { cursor: pointer; }
.cmp button { font-size: 11px; padding: 1px 6px; margin: 1px 2px 1px 0; white-space: nowrap; }
button[disabled] { opacity: .45; cursor: default; }
/* what dtree checked itself, how a trial would merge, the agents' sandbox and caps, the spend */
.cmp td.vf, .cmp td.mg { white-space: nowrap; }
.vgood { color: #4ade80; } .vbad { color: #f87171; } .vwarn { color: var(--open); } .vsame { color: var(--dim); }
a.lk { color: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.agi { font-size: 11px; color: var(--dim); margin: 2px 0 0; }
.agi span { margin-right: 8px; }
details.agoff { font-size: 11px; color: var(--dim); margin: 2px 0; }
details.agoff summary { cursor: pointer; }
details.agoff > div { margin: 3px 0 0 10px; }
.budget { border: 1px solid var(--open); background: rgba(245, 158, 11, .12); border-radius: 6px; padding: 5px 8px; margin: 4px 0; color: var(--text); white-space: normal; }
.budget b { color: var(--open); }
.bar { height: 6px; background: #222a35; border-radius: 3px; overflow: hidden; margin: 4px 0 10px; max-width: 460px; }
.bar i { display: block; height: 100%; background: var(--chosen); }
.bar.over i { background: #ef4444; }
.ckl button { font-size: 11px; padding: 2px 6px; margin: 0 4px 4px 0; }
.ckl button.on { border-color: var(--accent); background: rgba(102, 252, 241, .15); }
#ckLog { max-height: 56vh; overflow: auto; background: #0b0f14; border: 1px solid #222a35; padding: 6px; margin-top: 6px; }
#ovlTools input[type="month"] { padding: 2px 6px; margin: 0 4px; }
table.sp td, table.sp th { font-size: 12px; padding: 4px 6px; }
table.sp th:nth-child(n+2):nth-child(-n+8) { text-align: right; }
table.sp tr.tot td { border-top: 1px solid var(--line); font-weight: bold; }
.trial select { font-size: 12px; padding: 2px 6px; margin: 4px 4px 0 0; max-width: 200px; }
#msg, #newMsg { color: var(--open); }
#newForm { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
#newForm input, #newForm textarea { width: 100%; box-sizing: border-box; margin: 2px 0; }
#newForm textarea { min-height: 52px; resize: vertical; }
.cm { padding: 3px 0; border-bottom: 1px solid #222a35; }
.cm code { color: var(--accent); }
.cm details summary { cursor: pointer; color: var(--dim); }
.files { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); }
.files .a { color: var(--chosen); } .files .d { color: #ef4444; }
.ev { padding: 2px 0; border-bottom: 1px solid #222a35; }
a.jump { color: var(--accent); cursor: pointer; text-decoration: underline; margin-right: 6px; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
aside { overflow-x: hidden; overflow-wrap: anywhere; }
.node text { font-size: 12px; fill: var(--text); pointer-events: none; }
.node .sub { font-size: 11px; fill: var(--dim); }
.node rect { stroke-width: 1.5; }
.node { cursor: pointer; }
.node.faded { opacity: .25; }
.node.sel rect { stroke: var(--accent) !important; stroke-width: 3; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
.edge.taken { stroke: var(--chosen); stroke-width: 2.2; }
.edge.also { stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; }
.edge.topic { stroke-dasharray: 9 4; }
.edge.sequence { stroke: #6b7686; stroke-dasharray: 2 4; stroke-width: 1.5; }
.tog { font-size: 12px; fill: var(--accent); pointer-events: auto; }
/* the board (kanban of the questions), overlays, pros/cons, superseded */
#board { flex: 1 1 0; min-width: 0; overflow: auto; padding: 10px; display: flex; gap: 10px; align-items: flex-start; }
.col { flex: 0 0 230px; background: #121821; border: 1px solid #222a35; border-radius: 8px; padding: 6px; max-height: 100%; overflow: auto; box-sizing: border-box; }
.col h3 { font-size: 13px; margin: 2px 2px 6px; padding-bottom: 3px; display: flex; justify-content: space-between; }
.col h3 .n { color: var(--dim); font-weight: normal; }
.card { background: #1b2430; border: 1px solid #2b3542; border-left: 4px solid var(--line); border-radius: 6px; padding: 5px 7px; margin: 0 0 6px; cursor: pointer; font-size: 12px; }
.card:hover { border-color: var(--accent); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.superseded { opacity: .6; }
.card .t { font-size: 13px; }
.card .ans { color: var(--chosen); margin-top: 2px; }
.card .chips { margin-top: 3px; color: var(--dim); }
.card .chips span { margin-right: 6px; white-space: nowrap; }
.card .chips span span { margin-right: 0; }
.card .chips:empty { display: none; }
.col .more { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 12px; }
.pc { font-size: 12px; margin: 2px 0 0 4px; }
.pc .pro { color: var(--chosen); } .pc .con { color: #ef4444; }
.supbar { border: 1px solid #a78bfa; background: rgba(167, 139, 250, .12); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
.node.superseded { opacity: .5; }
#ovl { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 20; display: flex; align-items: center; justify-content: center; }
#ovlBox { background: #0d1117; border: 1px solid var(--line); border-radius: 10px; width: min(1100px, 94vw); max-height: 90vh; display: flex; flex-direction: column; color-scheme: dark; }
#ovlHead { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #222a35; }
#ovlHead b { flex: 1; color: var(--accent); }
#ovlBody { overflow: auto; padding: 8px 12px; font-size: 13px; }
#ovlBody pre, pre.md { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.dl .add { color: #4ade80; } .dl .del { color: #f87171; } .dl .hunk { color: var(--accent); } .dl .meta { color: var(--dim); }
.dfiles { margin-bottom: 8px; }
.cutnote { color: var(--open); margin: 6px 0; }
#ovlBody textarea { width: 100%; box-sizing: border-box; min-height: 90px; }
/* ⚙ the settings overlay (GET /api/settings): a part per section and per agent, each with its own Save */
.sttop > div { margin: 2px 0; }
.sttoc { margin: 6px 0 2px; } .sttoc a { margin-right: 12px; }
.stsec, .stcard { border: 1px solid #222a35; border-radius: 8px; background: #10151d; margin: 8px 0; }
.stsec { padding: 4px 10px 8px; }
.stsec > h3, .sth3 { font-size: 14px; color: var(--accent); margin: 6px 0 4px; }
.sth3 { margin-top: 14px; }
.stcard > summary { cursor: pointer; padding: 6px 10px; }
.stcard[open] > summary { border-bottom: 1px solid #222a35; }
.stcard > div { padding: 4px 10px 8px; }
.stcard code, .stl code { color: var(--dim); font-size: 11px; }
.stgrp > h4 { font-size: 12px; font-weight: normal; color: var(--accent); margin: 10px 0 0; padding-bottom: 2px; border-bottom: 1px solid #1a212b; }
.stf { display: grid; grid-template-columns: minmax(150px, 32%) minmax(0, 1fr); column-gap: 12px; padding: 5px 4px; border-bottom: 1px solid #161c25; }
.stl { padding-top: 3px; }
.stl code { display: block; overflow-wrap: anywhere; }
.sti { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.sti input[type="number"], .sti input[type="text"] { width: 240px; max-width: 100%; box-sizing: border-box; }
.sti select { max-width: 100%; }
.sti input::placeholder, .stkey input::placeholder, #stAddName::placeholder { color: #6b7686; }
.sth, .stw, .ste { grid-column: 2; font-size: 12px; margin-top: 2px; }
.sth { color: var(--dim); } .sth details summary { cursor: pointer; }
.stw { color: var(--open); }
.ste { color: #f87171; } .ste:empty { display: none; }
.stro { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.stf.changed > .stl::before { content: '● '; color: var(--accent); }
.stf.bad { background: rgba(239, 68, 68, .10); border-radius: 4px; }
.streset { font-size: 11px; padding: 1px 6px; }
.stbtns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.stbtns > label { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
.stbtns select { min-width: 0; max-width: 100%; }
.stmsg { font-size: 12px; overflow-wrap: anywhere; } .stmsg:empty { display: none; }
.stkey { border: 1px dashed var(--line); border-radius: 6px; padding: 5px 8px; margin: 6px 0; }
.stkey input[type="password"] { width: 300px; max-width: 100%; box-sizing: border-box; }
.stkey input[disabled] { opacity: .45; cursor: not-allowed; }
.streq { margin: 3px 0 0; }
@media (max-width: 760px) { .stf { grid-template-columns: minmax(0, 1fr); } .sth, .stw, .ste { grid-column: 1; } }
@media (max-width: 760px) { #wrap { flex-direction: column; } aside { flex: 0 0 45%; width: auto; border-left: 0; border-top: 1px solid #2b3542; } }
/* the side panel's home (what waits for the person), the status chips, the legend under ℹ️, 🧙 setup, the toolbar on a narrow screen */
#home h2 { margin-top: 4px; }
.hgrp { margin: 6px 0; }
.hgrp h3 { padding-left: 6px; }
.hgrp .n { color: var(--dim); font-weight: normal; }
.hitem { padding: 2px 0 2px 6px; border-left: 3px solid var(--line); margin: 2px 0; cursor: pointer; }
.hitem:hover { border-left-color: var(--accent); }
.hitem b { font-weight: normal; color: var(--accent); }
.hacts button { margin: 6px 6px 0 0; }
.banner { border: 1px solid var(--open); background: rgba(245, 158, 11, .12); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
.banner button { margin-left: 6px; }
.keys { color: var(--dim); font-size: 12px; margin-top: 10px; }
.keys kbd { background: #2b3542; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: inherit; }
#counts button.flt { font-size: 12px; padding: 1px 8px; margin: 0 2px; border-color: transparent; background: transparent; color: var(--dim); border-radius: 4px 4px 0 0; }
#counts button.flt[aria-pressed="true"] { color: var(--text); background: rgba(102, 252, 241, .15); }
details#help > summary { cursor: pointer; color: var(--accent); margin-top: 12px; }
details#help h2 { margin-top: 8px; }
.wzsteps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.wzsteps span { padding: 2px 8px; border-radius: 12px; border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.wzsteps span.on { border-color: var(--accent); color: var(--text); background: rgba(102, 252, 241, .15); }
.wzsteps span.ok { color: var(--chosen); }
.wzrow { padding: 6px 8px; border: 1px solid #222a35; border-radius: 8px; margin: 6px 0; }
.wzrow label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.wzrow input[type="password"] { width: 320px; max-width: 100%; box-sizing: border-box; }
.wznav { display: flex; gap: 8px; align-items: center; margin-top: 12px; border-top: 1px solid #222a35; padding-top: 8px; }
.wznav .sp { flex: 1; }
pre.cmd { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0f14; border: 1px solid #222a35; padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 900px) { header button .lbl { display: none !important; } }
/* a story: the scene panel, the reader, the projects overlay */
.choice { padding: 4px 6px; margin: 3px 0; border-radius: 6px; border: 1px solid #2b3542; }
.choice .to { color: var(--accent); }
.choice .none { color: var(--open); }
.reader { max-width: 760px; margin: 0 auto; font-size: 15px; line-height: 1.7; }
.reader h2 { font-size: 20px; color: var(--accent); margin: 6px 0 10px; }
.reader .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 14px; }
.reader button.go { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 12px; font-size: 15px; }
.reader .trail { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
.reader .end { color: var(--chosen); font-weight: bold; margin: 10px 0; }
#sceneEdit input, #sceneEdit textarea { width: 100%; box-sizing: border-box; margin: 2px 0; }
#sceneEdit textarea { min-height: 60px; resize: vertical; }
.prow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 5px 8px; border: 1px solid #222a35; border-radius: 6px; margin: 4px 0; }
.prow.cur { border-color: var(--accent); }
.prow code { color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
.prow .sp { flex: 1; min-width: 0; }
.pform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.pform input[type="text"] { width: 260px; max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1>dtree — <span class="th">ต้นไม้การตัดสินใจ</span><span class="en">decision tree</span></h1>
  <span id="proj" title=""></span>
  <button id="projBtn" title="โปรเจกต์: สร้างใหม่ เปิด แก้ไข นำเข้า ส่งออก บันทึกเป็น (p) · projects: new, open, edit, import, export, save as (p)">📁 <span class="th lbl">โปรเจกต์</span><span class="en lbl">Projects</span></button>
  <button id="vTree" aria-pressed="true" title="t">🌳 <span class="th lbl">ต้นไม้</span><span class="en lbl">Tree</span></button><button id="vBoard" title="b">▦ <span class="th lbl">บอร์ด</span><span class="en lbl">Board</span></button>
  <button id="newQ" title="n">+ <span class="th lbl">คำถามใหม่</span><span class="en lbl">New question</span></button>
  <input type="search" id="q" placeholder="search · ค้นหา   /">
  <label class="chk" id="chkWrap"><input type="checkbox" id="showAll" checked><span class="th">แสดงทางที่ไม่ได้เลือก</span><span class="en">Show the branches not taken</span></label>
  <button id="expand"><span class="th">ขยายทั้งหมด</span><span class="en">Expand all</span></button>
  <button id="collapse"><span class="th">ย่อทั้งหมด</span><span class="en">Collapse all</span></button>
  <button id="fit"><span class="th">พอดีจอ</span><span class="en">Fit</span></button>
  <button id="ctxBtn" title="การตัดสินใจที่ใช้อยู่ สรุปสั้นสำหรับ AI · the decisions in force, short, for agents">🧭 <span class="th lbl">บริบทสำหรับ AI</span><span class="en lbl">Context for agents</span></button>
  <button id="spendBtn" title="ค่าใช้จ่ายของ AI ต่อเดือน เทียบงบ · what the agents spent per month, against the budget">💰 <span class="th lbl">ค่าใช้จ่าย</span><span class="en lbl">Spend</span></button>
  <button id="setBtn" title="ตั้งค่าของโปรเจกต์และ AI: key อัตราการเรียก งบ เพดาน และอื่นๆ (.dtree/config.json) (s) · the project's and the agents' settings: keys, rate limits, budgets, caps and the rest (.dtree/config.json) (s)">⚙ <span class="th">ตั้งค่า</span><span class="en">Settings</span></button>
  <button id="setupBtn" title="ตั้งค่าเริ่มต้นทีละขั้น: เลือก AI ใส่ key ทดสอบ เลือกตัวหลัก (w) · first-run setup, step by step: pick the AIs, their keys, a test of each, the default (w)">🧙 <span class="th lbl">ตั้งค่าเริ่มต้น</span><span class="en lbl">Setup</span></button>
  <button id="reload" title="r"><span class="th">โหลดใหม่</span><span class="en">Reload</span></button>
  <select id="langSel" title="language · ภาษา"><option value="en" selected>English</option><option value="th">ไทย</option></select>
  <span class="dim" id="counts"></span>
</header>
<div id="wrap">
  <div id="board" hidden></div>
  <div id="view"><svg id="svg" role="img" aria-label="decision tree: question → options → the one taken → the questions that followed / ต้นไม้การตัดสินใจ: คำถาม → ทางเลือก → ทางที่เลือก → คำถามที่ตามมา"><g id="world"></g></svg></div>
  <aside>
    <div id="newForm" hidden>
      <h2 id="nHead">+ <span class="th">คำถามใหม่</span><span class="en">New question</span></h2>
      <div id="nAfter" class="dim" hidden></div>
      <input id="nTitleEn" placeholder="title (English) · หัวข้อ (อังกฤษ)">
      <input id="nTitleTh" placeholder="title (Thai, optional) · หัวข้อ (ไทย)">
      <textarea id="nQEn" placeholder="question (English) · คำถาม (อังกฤษ)"></textarea>
      <textarea id="nQTh" placeholder="question (Thai, optional) · คำถาม (ไทย)"></textarea>
      <textarea id="nOpts" placeholder="options, one per line · ทางเลือก บรรทัดละข้อ:&#10;yes: Do it | ทำ *&#10;no: Not yet | ยังไม่ทำ&#10;(* = recommended · ทางที่แนะนำ)"></textarea>
      <button id="nSend"><span id="nSendLbl"><span class="th">ตั้งคำถาม</span><span class="en">Ask</span></span></button>
      <button id="nCancel"><span class="th">ยกเลิก</span><span class="en">Cancel</span></button>
      <div id="newMsg"></div>

// writes from another machine need the server's token: every non-GET request carries X-DTree-Token (localStorage 'dtree_token');
// a 401 asks for it once. Requests from the server's own machine need none.
(function () {
  var orig = window.fetch;
  window.fetch = function (url, opts) {
    opts = opts || {};
    var m = String(opts.method || 'GET').toUpperCase();
    if (m === 'GET' || m === 'HEAD') return orig.call(window, url, opts);
    var tok = ''; try { tok = localStorage.getItem('dtree_token') || ''; } catch (e) {}
    opts.headers = Object.assign({}, opts.headers || {}, { 'X-DTree-Token': tok });
    return orig.call(window, url, opts).then(function (res) {
      if (res.status !== 401) return res;
      var t = window.prompt('ใส่รหัสสั่งงานของ dtree (ไฟล์ .dtree/write_token บนเครื่องเซิร์ฟเวอร์) · enter dtree\'s write token (.dtree/write_token on the server)');
      if (!t) return res;
      try { localStorage.setItem('dtree_token', t.trim()); } catch (e) {}
      opts.headers['X-DTree-Token'] = t.trim();
      return orig.call(window, url, opts);
    });
  };
})();

  t.nodes.forEach(function (n) { if (n.parent != null && by[n.parent]) kids[n.parent].push(n.id); });

    if (state.collapsed['d' + id]) { node.folded = kids[id].length + n.options.length; return node; }

      on.children = kids[id].filter(function (k) { return by[k].on_option === o.key; }).map(function (k) { placed[k] = 1; return dnode(k); });

function wireScene(box, n) {

function pPost(url, body, msgId, then) {

  fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok) { stSay(msgId, '✗ ' + stErrText(j), 'vbad'); return; }
    then(j);
  }).catch(function () { stSay(msgId, T('ติดต่อ server ไม่ได้', 'Cannot reach the server'), 'vbad'); });
}

  if (trs.length) chips.push('<span title="' + esc(T('ทางลอง', 'trials')) + '">⎇×' + trs.length + '</span>');
  if (running) chips.push('<span title="' + esc(T('AI กำลังทำ', 'AI building')) + '">🤖 ' + running + '</span>');
  if (c) {                                           // dtree's own verification of each trial, and an adopted trial that merges now
    var ok = 0, bad = 0, other = 0, lines = [], ready = [], conf = [];
    trs.forEach(function (t) {
      var v = c.v[t.id], m = c.m[t.id], who = T('ทางลอง ', 'trial ') + t.id + (t.variant ? ' (' + agentLabel(t.variant) + ')' : '');
      if (v && v.status && v.status !== 'none') {
        if (v.status === 'passed') ok++; else if (v.status === 'failed') bad++; else other++;
        lines.push(who + ': ' + vst(v.status).text + (v.tests ? ' · ' + v.tests : '') + (v.base_tests ? ' · ' + T('ฐาน ', 'base ') + v.base_tests : ''));
      }
      if (m && t.status === 'adopted' && !c.merged[t.id]) { if (m.can_merge) ready.push(who); else if (m.state === 'conflicts') conf.push(who + ': ' + (m.conflict_count || 0) + T(' ไฟล์ขัดกัน', ' conflicts')); }
    });
    if (ok || bad || other) chips.push('<span title="' + esc(T('dtree ตรวจเอง', 'verified by dtree') + '\n' + lines.join('\n')) + '">🔎' + (ok ? ' <span class="vgood">✓' + (ok > 1 ? ok : '') + '</span>' : '') +
      (bad ? ' <span class="vbad">✗' + (bad > 1 ? bad : '') + '</span>' : '') + (other ? ' <span class="vwarn">⚠' + (other > 1 ? other : '') + '</span>' : '') + '</span>');
    if (ready.length) chips.push('<span class="vgood" title="' + esc(T('พร้อมรวมเข้า ' + base() + ': ', 'ready to merge into ' + base() + ': ') + ready.join(', ')) + '">⤵</span>');
    if (conf.length) chips.push('<span class="vwarn" title="' + esc(T('ใช้แล้วแต่ขัดกับ ' + base() + ' (อัปเดตก่อนรวม): ', 'adopted, but conflicts with ' + base() + ' (update before merging): ') + conf.join(', ')) + '">⤵⚠</span>');
  }
  if (n.code) chips.push('<span title="commits">⟨/⟩ ' + n.code + '</span>');
  if (n.usage) chips.push('<span title="' + esc('🪙 ' + T('งาน AI ของข้อนี้: ', 'this question\'s AI jobs: ') + useLine(n.usage)) + '">🪙 ' + esc(useTok(n.usage)) + '</span>');
  if (n.superseded_by != null) chips.push('<span>⤳ #' + n.superseded_by + '</span>');
  return chips.join('');
}
// the board's chips beyond the tree's data: dtree's last verification of each trial (the question's events, read again when their count
// changes) and, for an adopted trial not merged yet, whether it merges now (merge-check, looked at again after 30 s)
function cardFetch(n) {
  if (!(n.trials || []).length) return;
  var c = state.cards[n.id] || (state.cards[n.id] = { ev: null, v: {}, merged: {}, m: {}, mAt: 0, busy: false });
  var needItem = c.ev !== n.events, needMerge = Date.now() - c.mAt > 30000, events = n.events;
  if (c.busy || (!needItem && !needMerge)) return;
  c.busy = true;
  (needItem ? fetch('/api/decisions/' + n.id, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok) return;
    c.ev = events; c.v = {}; c.merged = {};
    (j.item.events || []).forEach(function (e) {
      var d = e.detail || {};
      if (e.action === 'verified' && d.trial != null) c.v[d.trial] = { status: d.status, tests: d.tests, base_tests: d.base_tests };
      if (e.action === 'merged' && d.trial != null) c.merged[d.trial] = 1;
    });
  }) : Promise.resolve()).then(function () {
    return Promise.all((n.trials || []).filter(function (t) { return t.status === 'adopted' && !c.merged[t.id]; }).map(function (t) {
      return fetch('/api/decisions/trials/' + t.id + '/merge-check', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok) c.m[t.id] = j.merge; });
    }));
  }).then(function () { c.mAt = Date.now(); }, function () {}).then(function () {
    c.busy = false;
    var now = ((state.tree && state.tree.nodes) || []).filter(function (x) { return x.id === n.id; })[0], box = document.querySelector('.card[data-id="' + n.id + '"] .chips');
    if (now && box) box.innerHTML = chipsHtml(now);
  });
}
function drawBoard() {
  var b = document.getElementById('board');
  if (!state.tree) { b.textContent = ''; return; }
  var q = document.getElementById('q').value.trim(), showAll = document.getElementById('showAll').checked;
  var cols = {}; COLS.forEach(function (c) { cols[c[0]] = []; });
  state.tree.nodes.forEach(function (n) { if (matches({ data: n }, q)) cols[columnOf(n)].push(n); });
  cols.done.sort(function (a, b) { return (b.done_at || b.decided_at || b.created) - (a.done_at || a.decided_at || a.created); });
  ['open', 'building', 'choose', 'decided', 'closed'].forEach(function (k) { cols[k].sort(function (a, b) { return b.id - a.id; }); });
  var h = '', drawn = [];
  COLS.forEach(function (c) {
    if (c[0] === 'closed' && !showAll) return;
    var list = cols[c[0]], shown = list;
    if (c[0] === 'done' && !state.boardAllDone && list.length > 30) shown = list.slice(0, 30);
    drawn = drawn.concat(shown);
    h += '<div class="col"><h3 style="border-bottom:2px solid var(' + c[3] + ')"><span>' + esc(T(c[1], c[2])) + '</span><span class="n">' + list.length + '</span></h3>' +
      shown.map(cardHtml).join('') +
      (shown.length < list.length ? '<div class="more" data-more="1">' + esc(T('แสดงทั้งหมด (' + list.length + ')', 'Show all (' + list.length + ')')) + '</div>' : '') +
      (c[0] === 'done' && state.boardAllDone && list.length > 30 ? '<div class="more" data-more="0">' + esc(T('แสดง 30 ล่าสุด', 'Show the latest 30')) + '</div>' : '') +
      (!list.length ? '<div class="dim">—</div>' : '') + '</div>';
  });
  b.innerHTML = h;
  Array.prototype.forEach.call(b.querySelectorAll('.card'), function (c) {
    c.onclick = function () { state.sel = 'd' + c.getAttribute('data-id'); drawBoard(); showSel(); };
  });
  Array.prototype.forEach.call(b.querySelectorAll('.more'), function (m) { m.onclick = function () { state.boardAllDone = m.getAttribute('data-more') === '1'; drawBoard(); }; });
  drawn.forEach(cardFetch);
  counts();
  clearTimeout(state.boardTimer);
  var running = state.tree.nodes.some(function (n) { return (n.trials || []).some(function (t) { return t.ai && t.ai.status === 'running'; }); });
  if (running) state.boardTimer = setTimeout(function () { if (state.mode === 'board') load(false); }, 10000);
}
function setMode(m) {
  state.mode = m;
  try { localStorage.setItem('dtree.view2', m); } catch (e) {}
  document.getElementById('vTree').setAttribute('aria-pressed', m === 'tree'); document.getElementById('vBoard').setAttribute('aria-pressed', m === 'board');
  document.getElementById('board').hidden = m !== 'board'; document.getElementById('view').hidden = m === 'board';
  ['expand', 'collapse', 'fit'].forEach(function (id) { document.getElementById(id).hidden = m === 'board'; });
  if (m !== 'board') clearTimeout(state.boardTimer);
  draw();
  if (m === 'tree' && state.tree) { if (state.sel) focusNode(state.sel); else home(); }
}
document.getElementById('vTree').onclick = function () { setMode('tree'); };
document.getElementById('vBoard').onclick = function () { setMode('board'); };
// ---------------------------------------------------------------- the code of a decision: commits, files, branches
var HOWCODE = { merged: ['รวมจากกิ่ง', 'merged from its branch'], recorded: ['ระบุเอง', 'named by hand'], backfilled: ['จับคู่ย้อนหลังจากประวัติ', 'matched from the history afterwards'] };
function filesHtml(files) {
  if (!files || !files.length) return '';
  return '<div class="files">' + files.map(function (f) {
    return '<span class="a">+' + (f.add == null ? '·' : f.add) + '</span> <span class="d">−' + (f.del == null ? '·' : f.del) + '</span> ' + esc(f.path); }).join('<br>') + '</div>';
}
function sum(files) { var a = 0, d = 0; (files || []).forEach(function (f) { a += f.add || 0; d += f.del || 0; }); return (files || []).length + T(' ไฟล์ ', ' files ') + '+' + a + ' −' + d; }
function commitHtml(c) {
  if (c.missing) return '<div class="cm"><code>' + esc((c.sha || '').slice(0, 7)) + '</code> ' + esc(T('ไม่พบใน git', 'not in git')) + '</div>';
  return '<div class="cm"><code>' + esc(c.short) + '</code> ' + (c.merge ? '⑂ ' : '') + esc(c.subject) +
    '<div class="dim">' + when(c.time) + (c.how ? ' · ' + esc(lab(HOWCODE, c.how)) : '') + '</div>' +
    (c.files && c.files.length ? '<details><summary>' + esc(sum(c.files)) + '</summary>' + filesHtml(c.files) + '</details>' : '') + '</div>';
}
function branchHtml(b, label) {
  if (!b) return '';
  if (!b.exists) return '<div class="dim">' + esc(label) + ' <code>' + esc(b.branch) + '</code> · ' + esc(T('ยังไม่มีกิ่งใน git', 'no such branch in git yet')) + '</div>';
  var st = b.merged ? T('รวมเข้า ' + base() + ' แล้ว', 'merged into ' + base()) : T('ยังไม่รวม · ', 'not merged · ') + (b.ahead || []).length + T(' commit ที่ ' + base() + ' ยังไม่มี', ' commits ' + base() + ' does not have');
  return '<div>' + esc(label) + ' <code>' + esc(b.branch) + '</code> · ' + esc(st) + '</div>' +
    (!b.merged && b.files && b.files.length ? '<details><summary>' + esc(T('ต่างจาก ' + base() + ': ', 'differs from ' + base() + ': ') + sum(b.files)) + '</summary>' + filesHtml(b.files) + '</details>' : '');
}
function codeHtml(j) {
  if (!j || !j.ok) return esc(T('อ่านไม่ได้', 'could not read'));
  if (!j.git) return esc(T('ไม่มี git', 'no git'));
  var h = branchHtml(j.branch, T('กิ่งของทางที่เลือก', 'branch of the option taken'));
  h += (j.commits || []).map(commitHtml).join('');
  if (!(j.commits || []).length) h += '<div class="dim">' + esc(j.before_git ? T('ทำก่อน commit แรกของ repo นี้ — ไม่มีโค้ดแยกของข้อนี้', 'done before this repository\'s first commit — no code of its own')
                                                          : T('ยังไม่ได้ระบุ commit ของข้อนี้', 'no commits named for this question yet')) + '</div>';
  (j.trials || []).forEach(function (t) {
    h += '<div class="trial">⎇ ' + esc(t.option) + ' · ' + esc(lab(TRIAL, t.status)) + branchHtml(t.branch, T('กิ่ง', 'branch')) + (t.commits || []).map(commitHtml).join('') + '</div>';
  });
  return h;
}
function linksHtml(n) {
  var out = [], by = {}; state.tree.nodes.forEach(function (x) { by[x.id] = x; });
  function a(id) { var x = by[id]; return '<a class="jump" data-id="' + id + '" title="' + esc(x ? CT(x, 'title') : '') + '">#' + id + '</a>'; }
  var HOW = { named: ['อ้างในข้อความ', 'named in its text'], topic: ['เรื่องเดียวกัน', 'same topic'], sequence: ['ถามต่อกันเท่านั้น', 'only asked next'] };
  if (n.parent != null) out.push(esc(T('ต่อจาก ', 'follows ')) + a(n.parent) + (HOW[n.parent_how] ? ' <span class="dim">(' + esc(T.apply(null, HOW[n.parent_how])) + ')</span>' : '') +
                                 (n.parent_why ? '<br><span class="dim">' + esc(n.parent_why) + '</span>' : ''));
  if ((n.also || []).length) out.push(esc(T('อ้างถึงด้วย ', 'also names ')) + n.also.map(a).join(''));
  if ((n.supersedes || []).length) out.push('⤳ ' + esc(T('แทนที่ ', 'supersedes ')) + n.supersedes.map(a).join(''));
  if (n.superseded_by != null) out.push('⤳ ' + esc(T('ถูกแทนที่โดย ', 'superseded by ')) + a(n.superseded_by));
  var after = state.tree.nodes.filter(function (x) { return x.parent === n.id; }).map(function (x) { return x.id; });
  if (after.length) out.push(esc(T('คำถามที่ตามมา ', 'followed by ')) + after.map(a).join(''));
  var named = state.tree.nodes.filter(function (x) { return (x.also || []).indexOf(n.id) >= 0; }).map(function (x) { return x.id; });
  if (named.length) out.push(esc(T('ถูกอ้างโดย ', 'named by ')) + named.map(a).join(''));
  return out.length ? out.join('<br>') : '<span class="dim">' + esc(T('ไม่อ้างถึงคำถามอื่น', 'names no other question')) + '</span>';
}
function unfoldTo(id) {
  var by = {}; state.tree.nodes.forEach(function (x) { by[x.id] = x; });
  for (var p = by[id] && by[id].parent; p != null; p = by[p] && by[p].parent) delete state.collapsed['d' + p];
  keep();
}
function counts() {                                // the counts as chips: one pressed filters the tree (faded) and the board (hidden) to that status
  var c = document.getElementById('counts');
  if (!state.tree) return;
  if (story()) {                                   // a story has no statuses to filter by: the scenes, the endings, the choices still to write
    var ix = storyIndex(), ends = 0, open = 0;
    ix.nodes.forEach(function (n) { if (!(n.options || []).length) ends++; (n.options || []).forEach(function (o) { if (!leadsTo(ix, n, o.key)) open++; }); });
    state.filter = null;
    c.innerHTML = '<span class="dim">' + esc(T('ฉาก ', 'scenes ') + ix.nodes.length + ' · ' + T('ตอนจบ ', 'endings ') + ends + ' · ' + T('ทางเลือกที่ยังไม่มีฉาก ', 'choices without a scene ') + open) + '</span>';
    return;
  }

    ['open', 'decided', 'done', 'dismissed'].map(function (s) {
      return '<button class="flt" data-flt="' + s + '" aria-pressed="' + (state.filter === s) + '" style="border-bottom:2px solid var(' + STATUS[s][2] + ')" title="' + esc(T('ดูเฉพาะ ', 'only ') + T(STATUS[s][0], STATUS[s][1])) + '">' + esc(T(STATUS[s][0], STATUS[s][1]) + ' ' + (k[s] || 0)) + '</button>'; }).join('') +
    ' <span class="dim">' + esc(T('ราก ', 'roots ') + state.tree.roots.length) + '</span>';
  each(c, 'button.flt', function (b) { b.onclick = function () { setFilter(b.getAttribute('data-flt') || null); }; });
}

// ---------------------------------------------------------------- a new question
function parseOptions(text) {               // "key: English | ไทย" (English first, 2026-11-04), "*" anywhere on the line marks the recommended one
  var out = [];
  String(text || '').split('\n').forEach(function (line) {
    line = line.trim(); if (!line) return;
    var rec = line.indexOf('*') >= 0; line = line.replace(/\*/g, '').trim();
    var i = line.indexOf(':'), key = i > 0 ? line.slice(0, i).trim() : '', rest = i > 0 ? line.slice(i + 1) : line;
    var parts = rest.split('|'), en = (parts[0] || '').trim(), th = (parts[1] || '').trim();
    out.push({ key: key || ('o' + (out.length + 1)), th: th || en, en: en || th, two: th, recommended: rec });   // two: the second part as typed (the second language's words)
  });
  return out;
}
function optionsOut(opts, second) {              // what the API takes: English, and the second language's words as th or in texts
  return opts.map(function (o) {
    var x = { key: o.key, en: o.en, recommended: !!o.recommended };
    if (second === 'th') x.th = o.th;
    else if (o.two) { x.texts = {}; x.texts[second] = o.two; }
    return x;
  });
}
function wordsOut(body, second, title2, text2) {  // the second boxes of a form into the body: Thai fields, or texts[<lang>]
  if (second === 'th') { body.title_th = title2; body.question_th = text2; }
  else if (title2 || text2) { body.texts = {}; body.texts[second] = { title: title2, question: text2 }; }
  return body;
}
document.getElementById('newQ').onclick = function () { openNewForm(); };
document.getElementById('nCancel').onclick = function () { document.getElementById('newForm').hidden = true; setAfter(null); };
document.getElementById('nSend').onclick = function () {
  function v(id) { return document.getElementById(id).value.trim(); }
  var m = document.getElementById('newMsg'), opts = parseOptions(document.getElementById('nOpts').value);
  if (!v('nTitleTh') && !v('nTitleEn')) { m.textContent = T('ใส่หัวข้อก่อน', 'Give it a title first'); return; }
  if (!v('nQTh') && !v('nQEn')) { m.textContent = T(story() ? 'ใส่เนื้อเรื่องก่อน' : 'ใส่คำถามก่อน', story() ? 'Write the scene first' : 'Write the question first'); return; }
  if (opts.filter(function (o) { return o.recommended; }).length > 1) { m.textContent = T('แนะนำได้ทางเดียว', 'Only one option can be recommended'); return; }
  var second = secondLang(), t2 = v('nTitleTh'), q2 = v('nQTh');      // the second boxes hold Thai, or the language shown
  var body = wordsOut({ kind: 'decision', title_en: v('nTitleEn') || t2, question_en: v('nQEn') || q2, options: optionsOut(opts, second) }, second, t2, q2);
  var after = state.newAfter;                     // a scene after one choice: it hangs on that choice in the tree (follows + follows_option)
  if (after) { body.follows = after.id; body.follows_how = 'sequence'; body.follows_why = T('ทางเลือก ', 'choice ') + after.key; body.follows_option = after.key; }
  post('/api/decisions', body, function (j) {
    ['nTitleTh', 'nTitleEn', 'nQTh', 'nQEn', 'nOpts'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('newForm').hidden = true; m.textContent = ''; setAfter(null);
    if (j.item) { state.sel = 'd' + j.item.id; location.hash = '#' + j.item.id; }
    load(false);
  }, 'newMsg');

// ---------------------------------------------------------------- loading
function load(refit) {
  if (Date.now() - state.spendAt > 15000) refreshSpend();          // what is left of the month caps beside the agents' names
  fetch('/api/decisions/tree', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    state.tree = j;
    var h = /^#(\d+)$/.exec(location.hash);                           // /tree.html#63 opens at question 63
    if (h && refit) { state.sel = 'd' + h[1]; unfoldTo(+h[1]); }
    draw(); showSel(); if (refit) { home(); if (h) focusNode(state.sel); }
  }).catch(function () { document.getElementById('counts').textContent = T('โหลดไม่ได้', 'could not load'); });
}
document.getElementById('showAll').onchange = function () { draw(); };
document.getElementById('reload').onclick = function () { load(false); };
document.getElementById('fit').onclick = fit;
document.getElementById('expand').onclick = function () { state.collapsed = {}; keep(); draw(); };
document.getElementById('collapse').onclick = function () {
  ((state.laid && state.laid.nodes) || []).forEach(function (n) { if (n.type === 'q' && n.children.length) state.collapsed[n.id] = 1; }); keep(); draw(); fit(); };
document.getElementById('q').addEventListener('input', function () { draw(); });

  if (ev.key !== 'Enter') return;
  var q = this.value.trim(), hit = ((state.laid && state.laid.nodes) || []).filter(function (n) { return n.type === 'q' && matches(n, q); })[0];
  if (hit) { state.sel = hit.id; draw(); showSel(); focusNode(hit.id); }

Promise.all([
  fetch('/api/project', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (p) {
    state.project = p || {};
    var e = document.getElementById('proj'); e.textContent = state.project.name || ''; e.title = state.project.root || '';
    if (state.project.name) document.title = 'dtree · ' + state.project.name + ' — decision tree / ต้นไม้การตัดสินใจ';
  }).catch(function () {}),
  refreshAgents(),

  fetch('/api/languages', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { if (j && j.ui && j.ui.length) LANG.list = j.ui; }).catch(function () {})
]).then(function () {
  var ql = /[?&]lang=([a-zA-Z]{2,3}(?:-[A-Za-z0-9]{2,8})?)\b/.exec(String(location.search || ''));                 // /?lang=ja chooses the language for this visit

  document.getElementById('help').addEventListener('toggle', keepHelp);

  if (/[?&]setup=1/.test(String(location.search || ''))) showSetup();                                           // /?setup=1 opens 🧙 at once
